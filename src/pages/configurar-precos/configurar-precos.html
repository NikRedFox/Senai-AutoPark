<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuração de preços</title>
    <link rel="icon" href="../../assets/images/Icon-tab.svg">
    <link rel="stylesheet" href="./src/styles/style-preco.css">
</head>
<body>    
    
    <main class="precos-container">        
        <div class="precos-title-container">
            <img src="../../assets/images/Logo-Senai-AutoPark.svg" alt="">
            <h1>Configuração de preços</h1>
        </div>

        <form method="post" action="">
            <h2>Preço por hora: R$ 20,00</h2>

            <fieldset class="precos-form">
                <div class="input-box">
                    <img src="./src/assets/images/Dollar sign.svg" alt="">
                    <input type="text" placeholder="Novo preço" id="preco" name="preco" required>
                </div>
            </fieldset>

            <button class="btn-precos" type="submit">Alterar</button>
            <a class="btn-precos" type="submit">Voltar</a>
        </form>
        
    </main>
</body>
</html>
