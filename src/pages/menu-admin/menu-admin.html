<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Administrador</title>
    <link rel="icon" href="../../assets/images/Icon-tab.svg">
    <link rel="stylesheet" href="../menu-admin/src/styles/style-menu-admin.css">
</head>
<body>    
    
    <main class="menu-container">
        <div class="menu-title-container">
            <img src="../../assets/images/Logo-Senai-AutoPark.svg" alt="">
            <h1>Configuração do Sistema</h1>
        </div>
       
        <div class="menu-button-row">
            <div class="btn-menu">                
                <a href="">
                    <img src="./src/assets/images/Icon-cadastro.svg" alt="">
                    Cadastro de Funcionários 
                </a> 
            </div>

            <div class="btn-menu">
                <a href="">
                    <img src="./src/assets/images/Icon-gerenciamento.svg" alt="">
                    Listar Funcionários
                </a> 
            </div>
        </div>

        <div class="menu-button-row">
            <div class="btn-menu">                
                <a href="">
                    <img src="./src/assets/images/Icon-gerenciamento.svg" alt="">
                    Configuração de Preços
                </a> 
            </div>

            <div class="btn-menu">
                <a href="">
                    <img src="./src/assets/images/Icon-admin.svg" alt="">
                    Configuração de Vagas
                </a> 
            </div>
        </div>

        <div class="menu-button-column">
            <div class="btn-menu">                
                <a href="">
                    <img src="./src/assets/images/keyboard_return.svg" alt="">
                    Voltar
                </a> 
            </div>
            
        </div>

    </main>
</body>
</html>
