<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Funcionários</title>
    <link rel="icon" href="../../assets/images/Icon-tab.svg">
    <link rel="stylesheet" href="../cadastro-funcionarios/src/styles/style-cadastro.css">
</head>
<body>    
    
    <main class="cadastro-container">        
         <div class="cadastro-title-container">
            <img src="../../assets/images/Logo-Senai-AutoPark.svg" alt="">
            <h1>Cadastro de Funcionários</h1>
        </div>

        <form method="post" action="">
            <fieldset class="cadastro-form">
                <input type="text" placeholder="Nome Completo" id="nome_completo" name="nome_completo" required>
                <input type="text" placeholder="Usuário" id="usuario" name="usuario" required>
                <input type="password" placeholder="Senha" id="senha" name="senha" required>
                <input type="email" placeholder="E-mail" id="email" name="email" required>
                <input type="text" placeholder="Cargo" id="cargo" name="cargo" required>
            </fieldset>

            <button class="btn-cadastro" type="submit">Cadastrar</button>
            <a class="btn-cadastro" type="submit">Voltar</a>
        </form>
        
    </main>
</body>
</html>
