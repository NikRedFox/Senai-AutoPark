<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar de Funcionários</title>
    <link rel="icon" href="../../assets/images/Icon-tab.svg">
    <link rel="stylesheet" href="./src/styles/style-alterar-funcionario.css">
</head>
<body>    
    
    <main class="alterar-container">        
         <div class="alterar-title-container">
            <img src="../../assets/images/Logo-Senai-AutoPark.svg" alt="">
            <h1>Alterar de Funcionários</h1>
        </div>

        <form method="post" action="">
            <fieldset class="alterar-form">
                <div class="input-box">
                    <img src="./src/assets/images/icon-user.svg" alt="">
                    <input type="text" placeholder="Nome Completo" id="nome_completo" name="nome_completo" required>
                </div>
                <div class="input-box">
                    <img src="./src/assets/images/icon-user.svg" alt="">
                    <input type="text" placeholder="Usuário" id="usuario" name="usuario" required>
                </div>
                <div class="input-box">
                    <img src="./src/assets/images/lock.svg" alt="">
                    <input type="password" placeholder="Senha" id="senha" name="senha" required>
                </div>
                <div class="input-box">
                    <img src="./src/assets/images/mail.svg" alt="">
                    <input type="email" placeholder="E-mail" id="email" name="email" required>
                </div>
                <div class="input-box">
                    <img src="./src/assets/images/Briefcase.svg" alt="">
                    <input type="text" placeholder="Cargo" id="cargo" name="cargo" required>
                </div>                
                
            </fieldset>

            <button class="btn-alterar" type="submit">Alterar</button>            
            <a class="btn-alterar" type="#">Voltar</a>
        </form>
    </main>
</body>
</html>
